---
- name: Install beanstalkd
  become: yes
  apt:
    pkg: beanstalkd
    state: latest
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure beanstalkd user exists
  become: yes
  user: name={{ beanstalkd.user }} system=yes create_home=no shell=/usr/sbin/nologin state=present

- name: Ensure persistence storage location exists and has proper ownership
  become: yes
  file: path="{{ beanstalkd.storage }}" state=directory owner={{ beanstalkd.user }} group={{ beanstalkd.user }} recurse=true
  notify: restart beanstalkd

- name: Ensure configuration is correct
  become: yes
  template: src=beanstalkd.tpl dest=/etc/default/beanstalkd
  notify: restart beanstalkd

- name: Ensure service drop-in directory exists
  become: yes
  file: path=/etc/systemd/system/beanstalkd.service.d state=directory mode=0755

# the packaged unit hardcodes User=beanstalkd
- name: Run beanstalkd as the configured user
  become: yes
  template: src=override.conf.tpl dest=/etc/systemd/system/beanstalkd.service.d/override.conf
  notify: restart beanstalkd

- name: Ensure service is running, and is configured to start on boot
  become: yes
  service: name=beanstalkd enabled=yes state=started
